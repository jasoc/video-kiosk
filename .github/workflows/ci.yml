name: CI

on:
  push:
    branches: [main]
  pull_request:
  # docker-publish.yml runs this whole workflow first and publishes only if it passes.
  workflow_call:

jobs:
  check:
    # No build step and no test suite (by design, see CLAUDE.md): what can break silently is
    # a syntax error in a file nobody opened in a browser or a container. Catch those.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python compiles
        run: python -m py_compile *.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript parses
        run: for f in static/*.js; do node --check "$f"; done

  trivy:
    # Dependency vulnerabilities, committed secrets and Dockerfile/compose misconfigurations of the
    # repo, then the same for the image as it would ship. HIGH and CRITICAL with a fix available
    # fail the build; what is deliberately accepted lives, with its reason, in .trivyignore.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: Build the image
        run: docker build -t video-kiosk:ci .

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: video-kiosk:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
