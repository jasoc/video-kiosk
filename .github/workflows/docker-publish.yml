name: Build and Push Container

# One image on GHCR, in channels — iterating never needs a version:
#   push to main           → sha-<short>, edge         (what a test kiosk can follow)
#   manual run on a branch → sha-<short>, br-<branch>  (gh workflow run docker-publish.yml --ref <branch>)
#   tag vX.Y.Z             → X.Y.Z, X.Y, X, latest     (a release; only this ever moves `latest`)
#   tag vX.Y.Z-rc.N        → X.Y.Z-rc.N                (a pre-release; `latest` stays where it is)
# sha-<short> is only ever the branch build: a release tag rebuilds the same commit with its
# version as a label, and must not repoint the sha tag away from the image that was tried.
# compose-ghcr.yaml defaults KIOSK_IMAGE to :latest; a test kiosk sets :edge.
# Nothing is pushed unless the whole CI (syntax checks, Trivy) passes on the same commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Only what ends up in the image. Not evaluated for tag pushes: a tag always builds.
    paths:
      - "*.py"
      - requirements.txt
      - static/**
      - Dockerfile
      - .dockerignore
  workflow_dispatch:

# Three pushes in a row publish once, the last one.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history and tags, for git describe below.
          fetch-depth: 0

      # Stamped on the image as org.opencontainers.image.version, so a running container
      # always says what it is: 1.3.0 on a release tag, 1.2.0-5-gabc1234 five commits after
      # it, the bare short sha before the first tag.
      - name: Compute version
        id: version
        run: |
          VERSION="$(git describe --tags --always --match 'v*')"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=edge,branch=main
            type=ref,event=branch,prefix=br-,enable=${{ github.ref != 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
