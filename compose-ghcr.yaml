services:
  video-kiosk:
    image: ghcr.io/jasoc/video-kiosk:0.0.2
    container_name: video-kiosk
    restart: unless-stopped
    ports:
      - ${PORT}:8080
    volumes:
      - ${VIDEO_DIR}:/app/videos
      - proxies:/app/proxies
      - data:/app/data

volumes:
  # low-res proxies built on demand; safe to delete, they get rebuilt
  proxies:
  # saved mosaics, one JSON file each: this one is worth keeping
  data:
