services:
  video-kiosk:
    # :latest = the last release (a vX.Y.Z tag); a test kiosk can follow :edge (main)
    # or pin :X.Y.Z / :sha-<short>. Set KIOSK_IMAGE in .env to change it.
    image: ${KIOSK_IMAGE:-ghcr.io/jasoc/video-kiosk:latest}
    container_name: video-kiosk
    restart: unless-stopped
    ports:
      - ${PORT}:8080
    volumes:
      - ${VIDEO_DIR}:/app/videos
      - proxies:/app/proxies
      - data:/app/data

volumes:
  # low-res proxies built on demand; safe to delete, they get rebuilt
  proxies:
  # saved mosaics and video analyses: this one is worth keeping
  data:
