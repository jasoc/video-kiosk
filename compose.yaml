services:
  video-kiosk:
    build: .
    image: video-kiosk:latest
    container_name: video-kiosk
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    volumes:
      - ./:/app
      - ${VIDEO_DIR}:/app/videos
      - proxies:/app/proxies
    environment:
      - PORT=${PORT}

volumes:
  # low-res proxies built on demand; safe to delete, they get rebuilt
  proxies:
