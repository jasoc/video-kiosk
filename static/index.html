<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Video Kiosk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Start / idle overlay (also provides the user gesture for unmuted autoplay) -->
  <div id="start-screen">
    <div class="start-inner">
      <span class="material-icons-round start-icon">auto_awesome_motion</span>
      <h1>Video Kiosk</h1>
      <p>Tocca per iniziare &middot; trascina un video dalla libreria per il mosaico</p>
    </div>
  </div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="tb-group">
      <button id="menuBtn" class="tb-btn" title="Libreria">
        <span class="material-icons-round">menu</span>
      </button>
      <span id="tb-title">Video Kiosk</span>
    </div>
    <div class="tb-group" id="durGroup">
      <button class="dur-btn" data-dur="7">7s</button>
      <button class="dur-btn active" data-dur="20">20s</button>
      <button class="dur-btn" data-dur="60">60s</button>
    </div>
    <div class="tb-group">
      <button id="pauseBtn" class="tb-btn" title="Pausa">
        <span class="material-icons-round">pause</span>
      </button>
      <button id="nextBtn" class="tb-btn" title="Prossima clip">
        <span class="material-icons-round">skip_next</span>
      </button>
      <button id="fullscreenBtn" class="tb-btn" title="Schermo intero">
        <span class="material-icons-round">fullscreen</span>
      </button>
    </div>
  </header>

  <!-- Library drawer -->
  <aside id="sidebar">
    <header class="sb-header">
      <span class="material-icons-round">video_library</span>
      <h3>Libreria</h3>
      <button id="closeSidebar" class="tb-btn"><span class="material-icons-round">close</span></button>
    </header>
    <p class="sb-hint">Tocca per riprodurre &middot; tieni premuto e trascina per il mosaico</p>
    <div id="library"></div>
  </aside>

  <!-- Canvas -->
  <main id="canvas">
    <div class="grid-stack" id="grid"></div>
    <div id="drop-hint">
      <span class="material-icons-round">add_to_queue</span>
      <span>Rilascia qui</span>
    </div>
  </main>

  <!-- Drag ghost + toast -->
  <div id="drag-ghost" class="hidden"></div>
  <div id="toast" class="hidden"></div>

</body>
</html>
