<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Video Kiosk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Start / idle overlay (also provides the user gesture for unmuted autoplay) -->
  <div id="start-screen">
    <div class="start-inner">
      <div class="start-mark"></div>
      <h1>Video Kiosk</h1>
      <p>Tocca per iniziare</p>
      <span class="start-sub">Tieni premuto un elemento della libreria e trascinalo per comporre un mosaico</span>
    </div>
  </div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="tb-group">
      <button id="menuBtn" class="tb-btn" title="Libreria">
        <span class="material-icons-round">menu</span>
      </button>
      <span id="tb-title">Video Kiosk</span>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button id="layoutBtn" class="tb-btn" title="Layout">
        <span class="material-icons-round">dashboard</span>
      </button>
      <button id="pauseBtn" class="tb-btn" title="Pausa">
        <span class="material-icons-round">pause</span>
      </button>
      <button id="nextBtn" class="tb-btn" title="Prossima clip">
        <span class="material-icons-round">skip_next</span>
      </button>
      <button id="fullscreenBtn" class="tb-btn" title="Schermo intero">
        <span class="material-icons-round">fullscreen</span>
      </button>
    </div>
  </header>

  <!-- Layout presets popover -->
  <div id="layout-pop" class="pop hidden"></div>

  <!-- Library drawer -->
  <aside id="sidebar">
    <header class="sb-header">
      <h3>Video Kiosk</h3>
      <button id="closeSidebar" class="tb-btn"><span class="material-icons-round">close</span></button>
    </header>

    <div class="sb-section-h">
      <span>Libreria</span>
      <button id="manageBtn" class="sb-icon-btn" title="Riordina i file">
        <span class="material-icons-round">drive_file_move</span>
      </button>
    </div>
    <p class="sb-hint" id="libHint">Tocca per riprodurre &middot; tieni premuto e trascina per il mosaico o su una cartella per spostare</p>
    <div id="library"></div>

    <div class="sb-section-h">
      <span>Mosaici salvati</span>
      <button id="saveMosaicBtn" class="sb-icon-btn" title="Salva il mosaico attuale">
        <span class="material-icons-round">add</span>
      </button>
    </div>
    <div id="mosaics"></div>
  </aside>

  <!-- Canvas -->
  <main id="canvas">
    <div class="grid-stack" id="grid"></div>
    <div id="drop-hint">
      <span class="material-icons-round">add_to_queue</span>
      <span>Rilascia qui</span>
    </div>
  </main>

  <!-- Text prompt modal (save / rename mosaic, new folder, rename file) -->
  <div id="prompt-modal" class="modal-wrap hidden">
    <div class="modal">
      <h4 id="promptTitle">Salva mosaico</h4>
      <input id="promptInput" type="text" maxlength="60" autocomplete="off" spellcheck="false" />
      <div class="modal-actions">
        <button id="promptCancel" class="btn ghost">Annulla</button>
        <button id="promptOk" class="btn primary">Salva</button>
      </div>
    </div>
  </div>

  <!-- Drag ghost + toast -->
  <div id="drag-ghost" class="hidden"></div>
  <div id="toast" class="hidden"></div>

</body>
</html>
